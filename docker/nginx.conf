server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /pdf-origin/ {
        proxy_pass https://bahvila.userguilhermeavila05.workers.dev/;
        proxy_set_header Host bahvila.userguilhermeavila05.workers.dev;
        proxy_ssl_server_name on;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /legacy/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
