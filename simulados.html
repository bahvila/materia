<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulados - Matéria Premium</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho">
        <div class="logo">
            <img src="logo.png" alt="Logótipo Matéria" width="150">
        </div>
        
        <nav class="menu-principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="apostilas.html">Apostila</a></li>
                <!-- Botão Simulado agora está ativo -->
                <li><a href="simulados.html" class="ativo-botao">Simulado</a></li>
                <li><a href="#">Biblioteca</a></li>
            </ul>
        </nav>

        <div class="menu-usuario">
            <img src="premium.png" alt="Matéria Premium" class="btn-img-premium">
            <button class="btn-entrar">Entrar</button>
            <button class="btn-entrar">Início</button>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL DOS SIMULADOS -->
    <main class="area-simulados-main">
        
        <div class="topo-simulados">
            <!-- Botão Novo Simulado -->
            <button id="btn-novo-simulado" class="btn-novo-simulado">
                NOVO SIMULADO <br> <strong>+</strong>
            </button>
            
            <!-- Janela oculta (Modal) para escolher a matéria do novo simulado -->
            <div id="modal-novo-simulado" class="modal-simulado-escondido">
                <input type="text" placeholder="Pesquisar por concurso, prova...">
                <div class="botoes-filtro-grid">
                    <button class="btn-filtro-modal ativo">Administração</button>
                    <button class="btn-filtro-modal">Concurso Banco do Brasil</button>
                    <button class="btn-filtro-modal">INSS</button>
                    <button class="btn-filtro-modal">Correios</button>
                </div>
            </div>
        </div>

        <!-- Lista de Simulados em andamento ou prontos -->
        <section class="lista-simulados">
            <!-- Cartão Simulado X -->
            <div class="cartao-simulado-item">
                <div class="info-simulado-item">
                    <h2>Simulado X</h2>
                    <a href="#" class="link-materiais">Materiais recomendados ↗</a>
                </div>
                <!-- Botão de Lixeira vermelho -->
                <button class="btn-lixeira">
                    🗑️
                </button>
            </div>
        </section>

    </main>

    <!-- SCRIPT PARA ABRIR O MODAL DO NOVO SIMULADO -->
    <script>
        const btnNovo = document.getElementById('btn-novo-simulado');
        const modalNovo = document.getElementById('modal-novo-simulado');

        btnNovo.addEventListener('click', () => {
            if (modalNovo.style.display === 'block') {
                modalNovo.style.display = 'none';
            } else {
                modalNovo.style.display = 'block';
            }
        });
    </script>
</body>
</html>
